name: Feature request
description: Suggest an improvement for Stepfork
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Do not include secrets, API keys,
        private prompts, credentials, or sensitive trace data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: What would you like Stepfork to do?
    validations:
      required: true
  - type: textarea
    id: desired-example
    attributes:
      label: Desired CLI/API example
      description: Show the command or code you wish existed.
      render: shell
    validations:
      required: true
