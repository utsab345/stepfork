name: Documentation issue
description: Report unclear, incorrect, or missing documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for improving the docs. Do not include secrets, API keys,
        private prompts, credentials, or sensitive trace data.
  - type: input
    id: location
    attributes:
      label: Where
      description: URL, file path, or CLI reference section with the problem.
      placeholder: docs/cli.md, `stepfork export` section
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
      description: Quote the text if possible and explain what is incorrect or unclear.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: What should the documentation say or show?
    validations:
      required: false