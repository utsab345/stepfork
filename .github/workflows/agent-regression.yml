name: Agent regression

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  langgraph-regression:
    name: Replay recorded LangGraph regressions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The langgraph extra is only needed to run the agent under replay.
      # No model provider credentials are configured anywhere in this job.
      - name: Sync dependencies
        run: uv sync --locked --python 3.13 --extra langgraph

      # These are committed, fail-on-regression tests generated by
      # `stepfork export`. They replay a recorded trace against the trusted
      # local entrypoint. Replay is frozen, so no network call and no
      # recording happens here. If the agent's behavior changes, this step
      # exits non-zero and fails the pull request.
      - name: Replay committed regression tests
        run: uv run --no-sync pytest examples/langgraph_agent/regression -q

      # Verifies the integration end to end against the runnable offline
      # example: record, frozen replay, diff, and subprocess exit codes.
      - name: Run LangGraph integration tests
        run: uv run --no-sync pytest tests/integration/test_langgraph_agent.py -q
