name: Publish

# Publishes to PyPI using trusted publishing (OIDC). No API token is stored.
#
# This workflow runs ONLY when a GitHub Release is published. It has no
# workflow_dispatch trigger and never runs on pushes or pull requests, so
# untrusted code cannot reach the publishing credentials. The release tag must
# match the version in src/stepfork/version.py exactly, or the build job fails
# before the publish job starts.
#
# Prerequisites before the first publish (see docs/pypi-publishing.md):
#   - a PyPI pending/trusted publisher for owner `utsab345`, repo `stepfork`,
#     workflow `publish.yml`, environment `pypi`;
#   - a GitHub environment named `pypi` (optionally with required reviewers).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Build sdist and wheel
        run: uv build

      - name: Validate distributions
        run: uvx twine check dist/*

      - name: Verify version matches release tag
        run: |
          version=$(python3 -c "import pathlib,re; print(re.search(r'__version__\\s*=\\s*\"([^\"]+)\"', pathlib.Path('src/stepfork/version.py').read_text()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "publish must run from a tag ref, got ${GITHUB_REF_TYPE}" >&2
            exit 1
          fi
          if [ "$version" != "$tag" ]; then
            echo "version.py ($version) does not match release tag ($tag)" >&2
            exit 1
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/stepfork
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
