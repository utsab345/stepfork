[project]
name = "stepfork"
dynamic = ["version"]
description = "Behavioral regression testing for AI agents."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [
    { name = "Utsab Dahal" }
]
keywords = [
    "ai",
    "agents",
    "llm",
    "testing",
    "regression-testing",
    "replay",
    "debugging",
    "pytest",
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
openai = [
    "openai>=1.0",
]
langgraph = [
    "langchain-core>=1.0",
    "langgraph>=1.0",
]

[project.urls]
Homepage = "https://github.com/utsab345/stepfork"
Repository = "https://github.com/utsab345/stepfork"
Issues = "https://github.com/utsab345/stepfork/issues"
PyPI = "https://pypi.org/project/stepfork/"

[project.scripts]
stepfork = "stepfork.cli.main:app"


[dependency-groups]
dev = [
    "hypothesis>=6.0",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.version]
path = "src/stepfork/version.py"


[tool.hatch.build.targets.wheel]
packages = ["src/stepfork"]


[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "examples",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "SECURITY.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "mkdocs.yml",
    "pyproject.toml",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/.artifacts",
    "**/.artifacts/**",
    "research_langgraph.py",
    "test.sftrace",
    "test.sftrace/**",
    "llm_test.sftrace",
    "llm_test.sftrace/**",
    "dist",
    "site",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "property: property-based tests",
]


[tool.coverage.run]
branch = true
source = ["stepfork"]


[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]


[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

ignore = []


[tool.ruff.lint.isort]
known-first-party = ["stepfork"]


[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
pretty = true

files = [
    "src/stepfork",
    "tests",
]
